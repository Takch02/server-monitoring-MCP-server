spring:
    web:
      locale: ko_KR
    servlet:
      encoding:
        force: true
        enabled: true
        charset: UTF-8

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: false

    datasource:
      url: ${DB_URL}
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
      hikari:
        max-lifetime: 580000
        connection-timeout: 30000
        idle-timeout: 300000
    mvc:
      async:
        request-timeout: 300000

    ai:
      mcp:
        server:
          protocol: STATELESS
          name: SpringServerDoctor
          version: 1.0.0
          capabilities:
            tool: true
            resource: false
            prompt: false
            completion: false

          stateless:
            mcp-endpoint: /mcp

logging:
  level:
    org.springframework.jdbc.core: INFO

openai:
  api-key: ${OPENAI_API_KEY}

forwarder:
  image-url : ${FORWARDER_IMAGE_URL}

mcp:
  server-url: ${AWS_URL}
  tool-rate-limit:
    default-permits-per-minute: 30
    default-burst-capacity: 5
    tools:
      get_health_status:
        permits-per-minute: 120
        burst-capacity: 20
      fetch_recent_logs:
        permits-per-minute: 30
        burst-capacity: 5
      fetch_error_logs:
        permits-per-minute: 30
        burst-capacity: 5
      diagnose_server:
        permits-per-minute: 15
        burst-capacity: 3
      list_demo_servers:
        permits-per-minute: 30
        burst-capacity: 5
      get_setup_guide:
        permits-per-minute: 30
        burst-capacity: 5
      register_server:
        permits-per-minute: 5
        burst-capacity: 1
