name: Build Incident Web

on:
  pull_request:
    branches: [main]
    paths: ['web/**', 'deploy/incident-web.Caddyfile', '.github/workflows/web-build.yml']
  push:
    branches: [main]
    paths: ['web/**', 'deploy/incident-web.Caddyfile', '.github/workflows/web-build.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
