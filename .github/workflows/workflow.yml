name: Deploy MCP Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/takch02/mcp-server
  CONTAINER_NAME: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.event_name == 'push' && 'mcp-server-production' || github.run_id }}
      cancel-in-progress: false

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 3. Gradle Build
      - name: Build with Gradle
        run: ./gradlew build

      # 4. Docker buildx 활성화
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 5. GHCR 로그인
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker 이미지 build + push
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/takch02/mcp-server:latest
            ghcr.io/takch02/mcp-server:${{ github.sha }}

      # 7. Oracle 서버 배포
      - name: Deploy to Oracle Server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        env:
          MCP_PUBLIC_HOST: ${{ secrets.EC2_HOST }}
          MCP_PUBLIC_PORT: "80"
          MCP_IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: MCP_PUBLIC_HOST,MCP_PUBLIC_PORT,MCP_IMAGE_TAG
          command_timeout: 15m
          script: |
            set -eu

            IMAGE=${{ env.IMAGE_NAME }}
            CONTAINER=${{ env.CONTAINER_NAME }}
            DEPLOY_IMAGE="$IMAGE:${MCP_IMAGE_TAG:?}"
            PUBLIC_URL="http://${MCP_PUBLIC_HOST:?}:${MCP_PUBLIC_PORT:?}"
            ENV_FILE="$HOME/mcp-server/.env"
            HEALTH_URL="http://127.0.0.1:${MCP_PUBLIC_PORT}/actuator/health"

            if [ ! -r "$ENV_FILE" ]; then
              echo "Cannot read the Server Doctor .env file"
              exit 1
            fi

            wait_for_health() {
              deadline=$(( $(date +%s) + 240 ))
              while :; do
                now=$(date +%s)
                remaining=$((deadline - now))
                if [ "$remaining" -le 0 ]; then return 1; fi
                request_timeout=3
                if [ "$remaining" -lt "$request_timeout" ]; then request_timeout=$remaining; fi
                if health=$(curl --fail --silent --max-time "$request_timeout" "$HEALTH_URL") &&
                    printf '%s\n' "$health" | grep -Eq '^[[:space:]]*\{[[:space:]]*"status"[[:space:]]*:[[:space:]]*"UP"'; then
                  return 0
                fi
                next_check=$((now + 5))
                if [ "$next_check" -gt "$deadline" ]; then next_check=$deadline; fi
                delay=$((next_check - $(date +%s)))
                if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
              done
            }

            docker pull "$DEPLOY_IMAGE"
            previous_id=$(docker ps -aq --no-trunc --filter "name=^/${CONTAINER}$")
            candidate_id=$(docker create \
              --name "$CONTAINER-candidate-$MCP_IMAGE_TAG" \
              -p "${MCP_PUBLIC_PORT}:8080" \
              --env-file "$ENV_FILE" \
              --env "AWS_URL=${PUBLIC_URL}" \
              --restart always \
              "$DEPLOY_IMAGE")
            if [ -n "$previous_id" ] && ! docker rename "$previous_id" "$CONTAINER-previous-$previous_id"; then
              docker rm "$candidate_id"
              exit 1
            fi

            if { [ -z "$previous_id" ] || docker stop "$previous_id"; } &&
                docker start "$candidate_id" && wait_for_health && docker rename "$candidate_id" "$CONTAINER"; then
              echo "Health check passed for $DEPLOY_IMAGE"
              if [ -n "$previous_id" ]; then
                docker rm "$previous_id" || echo "Could not remove the previous container $previous_id"
              fi
              exit 0
            fi

            echo "Deployment failed for $DEPLOY_IMAGE"
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} restarts={{.RestartCount}}' "$candidate_id" || true
            if ! docker update --restart=no "$candidate_id"; then
              echo "Could not disable automatic restart; removing the failed container before rollback"
              docker rm -f "$candidate_id" || echo "Could not remove the failed container $candidate_id"
            elif docker stop "$candidate_id"; then
              failed_name="$CONTAINER-failed-$candidate_id"
              if docker rename "$candidate_id" "$failed_name"; then
                echo "Failed container preserved as $failed_name"
              fi
            fi

            if [ -z "$previous_id" ]; then
              echo "No previous container available for rollback"
            elif docker rename "$previous_id" "$CONTAINER" && docker start "$previous_id" && wait_for_health; then
              echo "Rollback passed its health check"
            else
              echo "Rollback failed to restore a healthy container"
            fi
            exit 1
