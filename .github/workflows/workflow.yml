name: Deploy MCP Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/takch02/mcp-server
  CONTAINER_NAME: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 3. Gradle Build
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 4. Docker buildx 활성화
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 5. GHCR 로그인
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker 이미지 build + push
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/takch02/mcp-server:latest
            ghcr.io/takch02/mcp-server:${{ github.sha }}

      # 7. Oracle 서버 배포
      - name: Deploy to Oracle Server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ env.IMAGE_NAME }}
            CONTAINER=${{ env.CONTAINER_NAME }}
            CONTAINER_NEW="${CONTAINER}_new"

            echo "Pull latest image"
            docker pull $IMAGE:latest

            echo "Run new container for health check"
            docker stop $CONTAINER_NEW 2>/dev/null || true
            docker rm $CONTAINER_NEW 2>/dev/null || true
            docker run -d \
              --name $CONTAINER_NEW \
              -p 8081:8080 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/mcp-server/.env \
              --restart no \
              $IMAGE:latest

            echo "Wait for new container to be healthy"
            for i in $(seq 1 12); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/actuator/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed"
                break
              fi
              if [ "$i" = "12" ]; then
                echo "Health check failed — rolling back"
                docker stop $CONTAINER_NEW && docker rm $CONTAINER_NEW
                exit 1
              fi
              echo "Attempt $i/12: status=$STATUS, retrying in 5s..."
              sleep 5
            done

            echo "Swap containers"
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true
            docker rename $CONTAINER_NEW $CONTAINER
            docker update --restart always $CONTAINER

            echo "Clean unused images"
            docker image prune -f || true