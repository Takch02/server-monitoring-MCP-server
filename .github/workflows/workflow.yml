name: Deploy MCP Server

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/takch02/mcp-server
  CONTAINER_NAME: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 3. Gradle Build
      - name: Build with Gradle
        run: ./gradlew build

      # 4. Docker buildx 활성화
      - name: Set up Docker Buildx
        if: github.event_name == 'push'
        uses: docker/setup-buildx-action@v3

      # 5. GHCR 로그인
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker 이미지 build + push
      - name: Build and Push Docker Image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/takch02/mcp-server:latest
            ghcr.io/takch02/mcp-server:${{ github.sha }}

      # 7. Oracle 서버 배포
      - name: Deploy to Oracle Server
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ env.IMAGE_NAME }}
            CONTAINER=${{ env.CONTAINER_NAME }}

            echo "Pull latest image"
            docker pull $IMAGE:latest

            echo "Stop existing container"
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true

            echo "Run new container"
            docker run -d \
              --name $CONTAINER \
              -p 80:8080 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/mcp-server/.env \
              --restart always \
              $IMAGE:latest

            echo "Wait for new container to be healthy"
            for i in $(seq 1 12); do
              echo "--- docker logs (last 20 lines) ---"
              docker logs --tail 20 $CONTAINER 2>&1 || true
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80/actuator/health || echo "000")
              if [ "$STATUS" = "200" ]; then
                echo "Health check passed"
                exit 0
              fi
              if [ "$i" = "12" ]; then
                echo "Health check failed — starting rollback"
                PREV_IMAGE=$(docker images $IMAGE --format "{{.Tag}}" | grep -v latest | sort -r | sed -n '2p')
                if [ -n "$PREV_IMAGE" ]; then
                  docker stop $CONTAINER && docker rm $CONTAINER
                  docker run -d \
                    --name $CONTAINER \
                    -p 80:8080 \
                    --env-file /home/${{ secrets.EC2_USERNAME }}/mcp-server/.env \
                    --restart always \
                    $IMAGE:$PREV_IMAGE
                  echo "Rolled back to $PREV_IMAGE"
                else
                  echo "No previous image found for rollback"
                fi
                exit 1
              fi
              echo "Attempt $i/12: status=$STATUS, retrying in 5s..."
              sleep 5
            done

            echo "Clean unused images"
            docker image prune -f || true