name: Deploy MCP Server

on:
  push:
    branches: [ "main" ]
permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/takch02/mcp-server
  CONTAINER_NAME: mcp-server

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4

      # 2. JDK 설정
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      # 3. Gradle Build
      - name: Build with Gradle
        run: ./gradlew build -x test

      # 4. Docker buildx 활성화
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. GHCR 로그인
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Docker 이미지 build + push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/takch02/mcp-server:latest
            ghcr.io/takch02/mcp-server:${{ github.sha }}

      # 7. Oracle 서버 배포
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            IMAGE=${{ env.IMAGE_NAME }}
            CONTAINER=${{ env.CONTAINER_NAME }}

            echo "Pull latest image"
            docker pull $IMAGE:latest

            echo "Stop existing container"
            docker stop $CONTAINER || true
            docker rm $CONTAINER || true

            echo "Run new container"
            docker run -d \
              --name $CONTAINER \
              -p 80:8080 \
              --env-file /home/${{ secrets.EC2_USERNAME }}/mcp-server/.env \
              --restart always \
              $IMAGE:latest

            echo "Clean unused images"
            docker image prune -f || true